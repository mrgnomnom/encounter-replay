<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The page may only load itself: no connection can carry your files anywhere (also sent as a header, see public/_headers) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>OSRS Encounter Replay</title>
</head>
<body>
  <header>
    <h1>OSRS Encounter Replay</h1>
    <span class="meta" id="meta">No session loaded</span>
    <button id="connectFolder" hidden title="Connect Encounter Recorder's recordings folder, view only, so your recordings are listed and the plugin's Open replay button works">Setup Default Recording Directory</button>
    <button id="tutorialOpen" class="link" title="A one-minute tour of the replay, on the demo recording">Tutorial</button>
    <button id="privacyOpen" class="link" title="The folders this page can read, every file it has read, and why nothing leaves your computer">What this page can see</button>
    <select id="recordings" title="Recordings in Encounter Recorder's sessions folder, newest first"><option value="">Recordings…</option></select>
    <button id="openSession" title="Open a recording file from anywhere on this computer">Import Recording</button>
    <input type="file" id="file" accept=".jsonl,.json,.txt" hidden>
  </header>
  <main>
    <div class="resizer side" id="sideResizer" title="Drag to resize the side panel"></div>
    <div id="view">
      <div id="viewControls">
        <label title="Who the camera follows and the log is about">Follow <select id="followWho"><option value="me">you</option></select></label>
        <label title="Keep the camera on them. Panning lets go; tick to come back"><input type="checkbox" id="follow" checked> camera</label>
        <label><input type="checkbox" id="smooth" checked> Smooth</label>
        <label title="Objects listed when an instance loads. Objects that mechanics spawn always show."><input type="checkbox" id="scenery" checked> Map objects</label>
        <label title="The recorded collision map: walls and blocked tiles"><input type="checkbox" id="collision" checked> Collision</label>
        <label title="Animation and graphic IDs over heads, and names, animations and ages over objects mechanics spawn"><input type="checkbox" id="labels" checked> Debug labels</label>
        <span class="muted" id="bundleStatus"></span>
        <span class="muted">Drag or middle-drag to orbit · right-drag to pan · scroll to zoom</span>
      </div>
      <div id="notes" class="notes"></div>
      <div id="drop"><span>Drag and drop a recorded session here<br><button id="dropSetup" class="link">Or set a default recording directory</button></span></div>
    </div>
    <aside id="aside">
      <div class="orbs" id="orbs">
        <div class="orb" id="orbHp"><b>–</b><span>HP</span></div>
        <div class="orb" id="orbPray"><b>–</b><span>Prayer</span></div>
        <div class="orb" id="orbRun"><b>–</b><span>Run</span></div>
        <div class="orb" id="orbSpec"><b>–</b><span>Spec</span></div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="panelTitle" id="panelTitle"><span id="panelName">Inventory</span></div>
      <label class="follow-tab"><input type="checkbox" id="followTab" checked> follow the tab open in game</label>
      <label class="follow-tab"><input type="checkbox" id="accuracy" disabled> click accuracy in the timeline's stretch</label>
      <div id="panel"></div>
      <div class="panelTitle"><span id="summaryTitle">Whole recording</span><span class="muted" title="Drag across the timeline to sum up a stretch of it; × or Esc goes back to the whole recording">drag the timeline to pick a stretch</span></div>
      <div id="windowSummary" class="window-summary"></div>
      <div class="panelTitle"><span>Clicks this tick</span><span id="clickCount"></span></div>
      <div class="clicks" id="clicks"></div>
    </aside>
  </main>
  <footer>
    <div class="resizer bottom" id="footResizer" title="Drag to resize the bottom panel"></div>
    <div class="transport">
      <button id="prev" title="Previous tick (←)">◀</button>
      <button id="play" title="Play / pause (space)">▶ Play</button>
      <button id="next" title="Next tick (→)">▶</button>
      <select id="speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
      </select>
      <span class="tick" id="tickLabel">tick – / –</span>
      <button id="addNote" title="Add a note at the tick shown (N). Notes pop up on the map as playback passes them">＋ Note</button>
      <button id="exportOpen" title="Download what the timeline shows, notes included, as a file to share. Drag across the timeline first to export just a stretch">Export…</button>
      <label title="Untick to see everything that happened, while still following"><input type="checkbox" id="logFilter" checked> only lines about <span id="filterWho">you</span></label>
      <label><input type="checkbox" id="showVars"> varbits in log</label>
      <span class="legend" id="legend"></span>
      <select id="timelineView" title="What the timeline shows. Markers, notes and the stretch you picked stay the same in every view"></select>
    </div>
    <div class="timeline-wrap" id="timelineWrap">
      <div class="timeline-grip top" id="timelineGripTop" title="Drag up to make the timeline taller, growing the bottom panel with it; double-click to switch between tall and short"></div>
      <canvas id="timeline" title="Click to jump, drag to zoom into a stretch, drag the playhead to scrub"></canvas>
      <div id="timelineSel" class="timeline-sel" hidden></div>
      <span id="zoomLabel" class="zoom-label" hidden></span>
      <div id="timelineTip" class="timeline-tip" hidden></div>
      <button id="zoomReset" class="zoom-reset" title="Show the whole recording (Esc)" hidden>×</button>
      <div class="timeline-grip" id="timelineGrip" title="Drag to make the timeline taller or shorter; double-click to switch between tall and short"></div>
    </div>
    <div id="log"></div>
  </footer>
  <div id="landing" hidden></div>
  <dialog id="folderDialog" class="panel-dialog"></dialog>
  <dialog id="privacyDialog" class="panel-dialog"></dialog>
  <dialog id="exportDialog" class="panel-dialog"></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
